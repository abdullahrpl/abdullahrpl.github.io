name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Ganti ke 'master' jika branch utama kamu bernama master

# Mengatur izin token GITHUB_TOKEN untuk mengizinkan penyebaran ke GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Memastikan hanya satu penyebaran yang berjalan pada satu waktu 
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build React App
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
